baseURL: https://weilai.media/
languageCode: en-us
title: Wei Lai
paginate: 20
theme: 
  - "PaperMod"

enableRobotsTXT: true
buildDrafts: false
buildFuture: false
buildExpired: false
disablePathToLower: true # making Hugo generate case sensitive urls
enableEmoji: true

minify:
    disableXML: true
    minifyOutput: true

imaging:
  resampleFilter: box
  quality: 75
  hint: photo
  anchor: smart
  exif:
    includeFields: ''
    excludeFields: ''
    disableDate: false
    disableLatLong: true

params:
    mainSections: 
    - Projects
    env: production # to enable google analytics, opengraph, twitter-cards and schema.
    title: Wei Lai
    description: "Research on embodied pedagogical agents, instructional gesture, and multimodal interaction by Wei Lai."
    keywords: [Wei Lai, embodied pedagogical agents, instructional gesture, multimodal interaction, animation, illustration, PolyU]
    author: Wei Lai
    images: ["<link or path of image for opengraph, twitter-cards>"]
    DateFormat: "January 2, 2006"
    defaultTheme: auto # dark, light
    disableThemeToggle: false
    ShowReadingTime: false
    ShowShareButtons: false
    ShowPostNavLinks: true
    ShowBreadCrumbs: true
    ShowCodeCopyButtons: true
    disableSpecial1stPost: false
    disableScrollToTop: false
    comments: false
    hidemeta: false
    hideSummary: true
    showtoc: false
    tocopen: false

  
    # profile-mode
    profileMode:
        enabled: true # needs to be explicitly set
        title: ""
        subtitle: |
            I am [**Wei Lai**](/resume/), a Postdoctoral Fellow in Language Science and Technology at The Hong Kong Polytechnic University. I study **embodied AI teachers**, **instructional gesture**, and **multimodal interaction**: how speech, gesture, and gaze work together in teaching, and how that can be built into embodied pedagogical agents.

            My [**PhD at PolyU Design**](https://www.sd.polyu.edu.hk/en/meet-our-students/wei-lai) combined empirical work on word–gesture alignment, learning performance, and student perception (including eye tracking) with lecture prototypes of embodied AI teachers that were evaluated with students. I both research these systems and implement them—from gesture analysis to agent design and animation.

            **Recent work**

            - [**IJHCI 2026**](/projects/0_IJHCI2026/): instructional gesture framework for embodied AI teachers
            - [Computers & Education (under review)](/projects/0_CompEd-humanness/): perceived humanness and feedback from embodied AI teacher
            - [Multimodal corpus](/projects/0_multimodal-corpus/) (**dialogue**, **gesture**, **gaze**, **social-interaction cues**, and **fNIRS**; in progress)

            [**Research**](/research/), [**projects**](/projects/), and [**CV**](/resume/).
        # current GIF stays below the buttons, at its native 780×553
        imageUrl: "projects/4_publicity_film_design/images/hands_cover_1.gif"
        imageTitle: my image
        # add a new top image here later (same display width as the site: 780px)
        heroImageUrl: "images/judy.mp4"
        heroImageTitle: "Wei Lai"
        buttons:
