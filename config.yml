        enabled: true # needs to be explicitly set
        title: ""
        subtitle: |
            **Design-led research on embodied AI tutors, instructional gestures, and multimodal learning technologies.**

            Postdoctoral Fellow, PolyU Language Science and Technology. I work across animation design, language–gesture science, and AI-enhanced instruction.

            I am [**Wei Lai**](/resume/). I completed my [**PhD at PolyU Design**](https://www.sd.polyu.edu.hk/en/meet-our-students/wei-lai) on pedagogical agents and meaningful instructional gesture, using qualitative and quantitative methods including eye tracking. I am currently a postdoc in the [**Chen Si Lab**](https://sichen-lab.com/) (after [**BLC Lab**](https://blclab.org/)), building a multimodal instructional gesture corpus with South China Normal University and CS collaborators.

            I also specialize in [**animation**](/projects/6_InBlack/), [**moving image**](/projects/4_publicity_film_design/) and [**illustration**](/projects/8_illustration/). Human figures and embodied movements are what I keep watching; I work with virtual avatars, interactive sensors, pastel, and ink.

            **Current directions**

            1. **Embodied AI Tutors** — Design and evaluate instructional gestures for pedagogical agents
            2. **Multimodal Corpus** — Dialogue gesture data with cross-institutional CS collaboration
            3. **Platform Pipeline** — From human instruction evidence to recognition, production, and deployment in AI tutors

            **Featured work**

            - [IJHCI 2026](/projects/0_IJHCI2026/): Framework for designing and evaluating instructional gestures in embodied AI teachers
            - [Computers & Education (under review)](/projects/0_CompEd-humanness/): How perceived humanness in embodied pedagogical agents affects feedback uptake and revision
            - [Current: Multimodal instructional gesture corpus (PolyU × SCNU)](/projects/0_multimodal-corpus/)

            In this portfolio: research, design, and arts work, plus a [**CV**](/resume/).
