<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>粵語語音語調測試</title>
  <style>
    html, body { margin: 0; min-height: 100%; background: #f4f1ea; color: #1a1a1a; font-family: "PingFang HK", "Heiti TC", sans-serif; }
    main { max-width: 420px; margin: 18vh auto; background: #fff; border-radius: 24px; padding: 32px 28px; text-align: center; box-shadow: 0 12px 32px rgba(0,0,0,.06); }
    h1 { margin: 0 0 8px; font-size: 28px; }
    p { margin: 0 0 18px; font-size: 16px; color: #666; }
    input { width: 100%; box-sizing: border-box; border: 1px solid #e4e4e4; border-radius: 12px; padding: 12px 14px; font-size: 18px; }
    button { margin-top: 14px; border: 0; border-radius: 999px; background: #1a73e8; color: #fff; font-size: 18px; font-weight: 800; padding: 10px 22px; cursor: pointer; }
    .bad { color: #a33; min-height: 1.4em; margin-top: 10px; font-weight: 700; }
  </style>
</head>
<body>
  <main id="gate">
    <h1>粵語語音語調測試</h1>
    <p>請輸入密碼。</p>
    <form id="gate-form">
      <input id="gate-pass" type="password" autocomplete="current-password" autofocus>
      <button type="submit">進入</button>
      <div class="bad" id="gate-bad"></div>
    </form>
  </main>
  <script src="gate.js"></script>
</body>
</html>
